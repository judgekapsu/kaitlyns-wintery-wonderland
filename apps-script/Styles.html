<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--ink:#193b3a;--muted:#647a76;--green:#356c5b;--deep:#163f3b;--mint:#e8f1e9;--cream:#fbfaf5;--line:#e5e7dc;--gold:#c4a66a;--white:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 4%,#e8f0e9 0,transparent 32%),radial-gradient(ellipse at 88% 30%,#f1eee0 0,transparent 31%),var(--cream);color:var(--ink);font:15px/1.6 'DM Sans',Arial,sans-serif}
.site-header{max-width:1160px;margin:auto;padding:23px 30px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center;color:var(--ink);text-decoration:none;font-size:13px;letter-spacing:.025em}.brand strong{display:block;font:600 19px 'Playfair Display',Georgia,serif;letter-spacing:0}.brand-mark,.avatar{display:grid;place-items:center;border-radius:50%;background:var(--mint);color:var(--green)}.brand-mark{width:42px;height:42px;font-size:23px}nav{display:flex;gap:8px;align-items:center}button{cursor:pointer;font:inherit}.nav-link{padding:9px 15px;border:0;border-radius:24px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;transition:background .2s,color .2s}.nav-link:hover,.nav-link:focus-visible{background:var(--mint);color:var(--deep)}
main{max-width:1160px;margin:auto;padding:35px 30px 72px}.welcome-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;min-height:540px}.hero{position:relative;overflow:hidden;padding:55px 48px;border-radius:8px 90px 8px 8px;background:linear-gradient(145deg,#244f48,#173f3b);color:white;box-shadow:0 22px 55px #193b3a20}.hero:after{content:'✳';position:absolute;right:20px;bottom:-72px;color:#ffffff0d;font-size:270px;line-height:1}.hero h1{position:relative;z-index:1;margin:10px 0 18px;font:600 clamp(38px,4.4vw,56px)/1.12 'Playfair Display',Georgia,serif;letter-spacing:-.035em}.hero h1 span{color:#d9c89d}.hero p:last-of-type{max-width:370px;margin:0;color:#d6e3dc;font-size:16px}.eyebrow,.section-kicker{text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:700}.eyebrow{color:#d9c89d}.hero-note{position:relative;z-index:1;display:inline-flex;gap:10px;align-items:center;margin-top:46px;padding:11px 15px;border:1px solid #ffffff38;border-radius:30px;color:#e7eee7;font-size:12px}.hero-note span{color:#d9c89d}
.panel{margin-top:28px;padding:34px;border:1px solid var(--line);border-radius:9px;background:#fffdf9;box-shadow:0 14px 42px #183c3610}.login-panel{margin:0;padding:38px 42px}.section-kicker{margin:0 0 13px;color:var(--green)}h2{font:600 30px/1.18 'Playfair Display',Georgia,serif;letter-spacing:-.02em;margin:0 0 12px}.panel>p{color:var(--muted)}.login-panel>p:not(.section-kicker){margin:0 0 25px;font-size:13px}label{display:block;margin-bottom:14px;font-size:12px;font-weight:700;color:#37514c}input,select,textarea{display:block;width:100%;margin:7px 0 0;padding:12px 13px;border:1px solid #dce2d8;border-radius:5px;background:#fff;color:var(--ink);font:14px 'DM Sans',Arial,sans-serif;outline:none;transition:border .15s,box-shadow .15s}input::placeholder{color:#a3afaa}input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #356c5b18}textarea{min-height:96px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.wide{grid-column:1/-1}.button{display:flex;justify-content:space-between;align-items:center;gap:18px;width:100%;margin-top:9px;border:0;border-radius:5px;padding:14px 17px;background:var(--green);color:white;font-weight:700;box-shadow:0 5px 12px #356c5b25;transition:background .2s,transform .2s}.button:hover{background:var(--deep);transform:translateY(-1px)}.button:disabled{opacity:.6;transform:none}.status{min-height:20px;color:var(--muted);font-size:13px}.error{color:#a03939}.family-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.person-card{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:white}.person-toggle{width:100%;padding:15px;border:0;background:white;display:flex;align-items:center;justify-content:space-between;text-align:left;color:var(--ink);font-size:15px;font-weight:600}.person-toggle:hover{background:#f7f8f2}.avatar{width:36px;height:36px;margin-right:11px;display:inline-grid}.wish-items{display:none;padding:0 15px 13px}.person-card.open .wish-items{display:block}.wish-card{border-top:1px solid var(--line);padding:13px 0}.wish-card h3{margin:0;font:600 17px 'Playfair Display',Georgia,serif}.wish-card p,.tag{font-size:12px;color:var(--muted)}.tag{display:inline-block;margin:6px 5px 0 0;padding:3px 9px;background:var(--mint);border-radius:15px}.product-link{color:var(--green);font-weight:700}.price-tools{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:6px;background:#fbfcf8}.price-tools p{margin:0 0 6px}.subscriber-count{font-weight:700}.price-subscribe-form{display:flex;gap:8px;align-items:center}.price-subscribe-form input{margin:0;min-width:0}.price-subscribe-form button{flex:none;padding:10px 13px;border:0;border-radius:5px;background:var(--green);color:white;font-size:12px;font-weight:700}.price-subscribe-form button:disabled{opacity:.6}.price-tools .status{margin:6px 0 0}.hidden{display:none!important}footer{max-width:1160px;margin:auto;padding:0 30px 28px;color:#7c8b83;font-size:11px;letter-spacing:.025em}footer span{color:var(--gold);margin-right:7px}
@media(max-width:800px){.site-header{padding:18px 20px}.welcome-layout{grid-template-columns:1fr;gap:22px;min-height:0}.hero{padding:39px 32px;border-top-right-radius:55px}.hero-note{margin-top:28px}.login-panel{padding:30px}.panel{padding:23px}main{padding:22px 20px 45px}.hero h1{font-size:42px}}
@media(max-width:520px){.site-header{align-items:flex-start;gap:14px;flex-direction:column}.brand strong{font-size:17px}.hero{padding:32px 25px}.hero h1{font-size:36px}.login-panel{padding:25px 22px}h2{font-size:27px}.form-grid,.family-list{grid-template-columns:1fr}.wide{grid-column:auto}nav{flex-wrap:wrap}.nav-link{padding:8px 11px}footer{padding:0 20px 24px}}
</style>
