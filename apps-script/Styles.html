<style>
:root{--ink:#193946;--muted:#60767e;--teal:#176c73;--ice:#e8f4f3;--line:#dce7e6}*{box-sizing:border-box}body{margin:0;background:#f8fbfa;color:var(--ink);font:15px/1.55 Arial,sans-serif}.site-header{max-width:1000px;margin:auto;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center;color:var(--ink);text-decoration:none}.brand strong{display:block;font:600 18px Georgia,serif}.brand-mark,.avatar{display:grid;place-items:center;border-radius:50%;background:var(--ice);color:var(--teal)}.brand-mark{width:38px;height:38px;font-size:21px}nav{display:flex;gap:6px}button{cursor:pointer}.nav-link{padding:9px 12px;border:0;border-radius:20px;background:transparent;color:var(--muted)}.nav-link:hover{background:var(--ice);color:var(--teal)}main{max-width:1000px;margin:auto;padding:10px 22px 45px}.hero{padding:35px;border-radius:16px;background:linear-gradient(110deg,#123e4b,#287a7c);color:white}.hero h1{font:600 38px/1.15 Georgia,serif;margin:5px 0}.hero h1 span{color:#c3e6df}.hero p:last-child{color:#e3f2ef}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:#a9d8d1}.panel{margin-top:28px;padding:24px;border:1px solid var(--line);border-radius:14px;background:white}h2{font:600 28px Georgia,serif;margin:0 0 8px}.panel>p{color:var(--muted)}label{display:block;font-size:13px;font-weight:bold}input,select,textarea{display:block;width:100%;margin:6px 0 14px;padding:11px;border:1px solid #cbd9d7;border-radius:7px;font:14px Arial,sans-serif}textarea{min-height:80px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.wide{grid-column:1/-1}.button{border:0;border-radius:7px;padding:12px 18px;background:var(--teal);color:white;font-weight:bold}.button:disabled{opacity:.6}.status{color:var(--muted);font-size:13px}.error{color:#a03939}.family-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.person-card{border:1px solid var(--line);border-radius:10px;overfl
